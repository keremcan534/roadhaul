<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#16191d" />
    <meta name="description" content="RoadHaul: a mobile logistics and truck simulation game." />
    <title>RoadHaul</title>
    <!-- The brand's mark on amber (src/ui/brand.ts), inline: nothing to fetch under any base path. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23f2a33a'/%3E%3Cg transform='translate(4.4 10) scale(.8)'%3E%3Cpath fill='%2316191d' d='M18 12a2 2 0 0 1 2-2h20v80H20a2 2 0 0 1-2-2zM40 10h16a24 24 0 0 1 0 48H40V43h14a9 9 0 0 0 0-18H40zM42.5 58H65l31 32H44.5z'/%3E%3Cpath fill='%23f2a33a' d='M53.99 60.5h2.1l2.58 4.5h-2.63zM57.87 69h3.11L65 76h-3.94zM63.12 80.5h4.47l5.46 9.5h-5.6z'/%3E%3C/g%3E%3C/svg%3E" />
    <!-- Paint the background before the stylesheet arrives, avoiding a white flash on phones. -->
    <style>
      html {
        background: #16191d;
      }
      /*
       * The boot screen: the brand's mark and a bar that keeps moving while the world is built (a transform, so it
       * runs off the main thread). It fades when the game is ready (html[data-boot-state], main.ts) or stops.
       */
      .boot-screen {
        position: fixed;
        /* inset's sides, for the WebViews too old for it (they are told to update, below). */
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 1000;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 28px;
        background: #16191d;
        transition:
          opacity 0.45s ease,
          visibility 0s linear 0.45s;
      }
      html[data-boot-state='ready'] .boot-screen,
      html[data-boot-state='error'] .boot-screen {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      /* Gone, the bar stops: an endless animation keeps the compositor drawing frames for nothing. */
      html[data-boot-state='ready'] .boot-screen__bar::after,
      html[data-boot-state='error'] .boot-screen__bar::after {
        animation: none;
      }
      /* Too old a WebView (the script below): no bar, the note and the way to update. */
      html[data-boot-state='unsupported'] .boot-screen__bar {
        display: none;
      }
      .boot-screen__note {
        max-width: 340px;
        margin: 0;
        padding: 0 24px;
        color: #e9edf0;
        font: 16px/1.45 sans-serif;
        text-align: center;
      }
      .boot-screen__update {
        padding: 12px 22px;
        border-radius: 10px;
        background: #f2a33a;
        color: #16191d;
        font: bold 16px sans-serif;
        text-decoration: none;
      }
      .boot-screen__mark {
        width: 88px;
        height: 88px;
      }
      .boot-screen__bar {
        position: relative;
        width: 148px;
        height: 3px;
        overflow: hidden;
        background: rgba(242, 163, 58, 0.18);
      }
      .boot-screen__bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        background: #f2a33a;
        will-change: transform;
        animation: boot-screen-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-screen-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-screen__bar::after {
          animation-duration: 3s;
        }
      }
    </style>
  </head>
  <body>
    <div class="boot-screen" aria-hidden="true">
      <svg class="boot-screen__mark" viewBox="0 0 100 100">
        <rect width="100" height="100" rx="22" fill="#f2a33a" />
        <g transform="translate(4.4 10) scale(.8)">
          <path
            fill="#16191d"
            d="M18 12a2 2 0 0 1 2-2h20v80H20a2 2 0 0 1-2-2zM40 10h16a24 24 0 0 1 0 48H40V43h14a9 9 0 0 0 0-18H40zM42.5 58H65l31 32H44.5z"
          />
          <path
            fill="#f2a33a"
            d="M53.99 60.5h2.1l2.58 4.5h-2.63zM57.87 69h3.11L65 76h-3.94zM63.12 80.5h4.47l5.46 9.5h-5.6z"
          />
        </g>
      </svg>
      <div class="boot-screen__bar"></div>
    </div>
    <canvas id="game-canvas"></canvas>
    <noscript>RoadHaul needs JavaScript to run.</noscript>
    <script>
      // An Android System WebView too old for the game's JavaScript (ES2022, as from Chrome 94) would leave the bar
      // moving for ever: the module below is not run, or fails to parse. The phone is told so instead, in its language,
      // with the way to update. ES5 on purpose, to run where the game cannot. The words are the string tables'
      // boot.oldWebview and boot.openPlay (tests/unit/ui/i18n/bootFallback.test.ts keeps them the same).
      (function () {
        var TEXT = {
          de: ['RoadHaul braucht ein neueres Android System WebView. Aktualisiere es (oder Chrome) bei Google Play und öffne das Spiel dann noch einmal.', 'Google Play öffnen'],
          en: ['RoadHaul needs a newer Android System WebView. Update it (or Chrome) in Google Play, then open the game again.', 'Open Google Play'],
          es: ['RoadHaul necesita un Android System WebView más reciente. Actualízalo (o Chrome) en Google Play y vuelve a abrir el juego.', 'Abrir Google Play'],
          fr: ['RoadHaul a besoin d’une version plus récente d’Android System WebView. Mets-la à jour (ou Chrome) sur Google Play, puis rouvre le jeu.', 'Ouvrir Google Play'],
          id: ['RoadHaul memerlukan Android System WebView yang lebih baru. Perbarui (atau Chrome) di Google Play, lalu buka game ini lagi.', 'Buka Google Play'],
          it: ['RoadHaul ha bisogno di una versione più recente di Android System WebView. Aggiornala (o aggiorna Chrome) su Google Play, poi riapri il gioco.', 'Apri Google Play'],
          pl: ['RoadHaul wymaga nowszego Android System WebView. Zaktualizuj go (lub Chrome) w Google Play, a potem uruchom grę ponownie.', 'Otwórz Google Play'],
          pt: ['O RoadHaul precisa de um Android System WebView mais recente. Atualize-o (ou o Chrome) no Google Play e abra o jogo de novo.', 'Abrir o Google Play'],
          ru: ['Для RoadHaul нужна более новая версия Android System WebView. Обнови её (или Chrome) в Google Play и открой игру снова.', 'Открыть Google Play'],
          tr: ['RoadHaul daha yeni bir Android System WebView istiyor. Google Play’den WebView’ı (ya da Chrome’u) güncelle, sonra oyunu yeniden aç.', 'Google Play’i aç'],
        };
        var root = document.documentElement;
        function supported() {
          if (!('noModule' in document.createElement('script'))) {
            return false;
          }
          try {
            new Function('class A { static {} #a = 1; b() { return this.#a ?? 0; } }');
            return true;
          } catch (error) {
            return false;
          }
        }
        function language() {
          var asked = /[?&]lang=([a-z]{2})/.exec(location.search);
          var wanted = [].concat(asked ? [asked[1]] : [], navigator.languages || [], navigator.language || []);
          for (var i = 0; i < wanted.length; i++) {
            var code = String(wanted[i]).slice(0, 2).toLowerCase();
            if (TEXT.hasOwnProperty(code)) {
              return code;
            }
          }
          return 'en';
        }
        function tell() {
          var screen = document.querySelector('.boot-screen');
          if (screen === null || root.getAttribute('data-boot-state') === 'unsupported') {
            return;
          }
          root.setAttribute('data-boot-state', 'unsupported');
          var text = TEXT[language()];
          var note = document.createElement('p');
          note.className = 'boot-screen__note';
          note.setAttribute('role', 'alert');
          note.appendChild(document.createTextNode(text[0]));
          var update = document.createElement('a');
          update.className = 'boot-screen__update';
          update.href = 'https://play.google.com/store/apps/details?id=com.google.android.webview';
          update.appendChild(document.createTextNode(text[1]));
          screen.removeAttribute('aria-hidden');
          screen.appendChild(note);
          screen.appendChild(update);
        }
        if (!supported()) {
          tell();
          return;
        }
        // Up to date as far as can be told: a parse error before the game starts (main.ts marks the boot) is one too.
        window.addEventListener('error', function (event) {
          if (!root.hasAttribute('data-boot-state') && event.error instanceof SyntaxError) {
            tell();
          }
        });
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
