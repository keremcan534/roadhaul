name: Release bundle

# Builds the signed Android App Bundle (.aab) that Google Play takes: from a version tag (v1.0.0) or by hand
# (Actions → Release bundle → Run workflow). The upload key comes from the repository's secrets; docs/RELEASE.md says
# how to make it and which secrets to add. Releases are built from main only, so their numbers only ever go up.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  bundle:
    name: Signed Android App Bundle
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history: the build's number counts its commits.
          fetch-depth: 0

      - name: Check the upload key's secrets
        env:
          KEYSTORE: ${{ secrets.ROADHAUL_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ROADHAUL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ROADHAUL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ROADHAUL_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE" ] || missing="$missing ROADHAUL_UPLOAD_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing ROADHAUL_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing ROADHAUL_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing ROADHAUL_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Add these repository secrets first (docs/RELEASE.md):$missing"
            exit 1
          fi

      # Google Play takes each upload only numbered higher than the last: main's commits only ever grow in number.
      - name: Number the build
        run: echo "ROADHAUL_VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # Capacitor 8 builds with JDK 21.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - run: npm ci

      - name: Typecheck and unit tests
        run: npm run typecheck && npm test

      - name: Build the game into the Android project
        run: npm run android

      - name: Unpack the upload key
        env:
          KEYSTORE: ${{ secrets.ROADHAUL_UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Build the bundle
        working-directory: android
        env:
          ROADHAUL_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          ROADHAUL_KEYSTORE_PASSWORD: ${{ secrets.ROADHAUL_KEYSTORE_PASSWORD }}
          ROADHAUL_KEY_ALIAS: ${{ secrets.ROADHAUL_KEY_ALIAS }}
          ROADHAUL_KEY_PASSWORD: ${{ secrets.ROADHAUL_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease

      - name: Forget the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: roadhaul-${{ github.ref_name }}-${{ env.ROADHAUL_VERSION_CODE }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error
