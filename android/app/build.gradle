apply plugin: 'com.android.application'

// The game's version comes from package.json.
def packageJson = new groovy.json.JsonSlurper().parse(file('../../package.json'))

android {
    namespace = "io.github.keremcan534.roadhaul"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.keremcan534.roadhaul"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI numbers its builds (ROADHAUL_VERSION_CODE), so a newer one installs over an older one.
        versionCode((System.getenv('ROADHAUL_VERSION_CODE') ?: '1') as Integer)
        versionName packageJson.version
        // The ads (docs/RELEASE.md): ROADHAUL_ADS is off, test or live. AdMob's app id goes into the manifest: the
        // game's own (ROADHAUL_ADMOB_APP_ID) for live ads, Google's sample app's for test ads.
        def ads = System.getenv('ROADHAUL_ADS') ?: 'off'
        def admobAppId = System.getenv('ROADHAUL_ADMOB_APP_ID')
        if (ads == 'live' && !admobAppId) {
            throw new GradleException('ROADHAUL_ADS=live needs ROADHAUL_ADMOB_APP_ID, AdMob\'s id for the app (docs/RELEASE.md).')
        }
        manifestPlaceholders += [admobAppId: admobAppId ?: 'ca-app-pub-3940256099942544~3347511713']
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // A debug key kept with the project: every debug build, from CI or any machine, installs over the
        // last one and keeps the saved game. It is public, so it must never sign a release.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // The upload key Google Play knows the game by: secret, never in the repository. CI unpacks it from the
        // repository's secrets (.github/workflows/release.yml); on a desktop it comes from the same variables
        // (docs/RELEASE.md). Without them a release build is left unsigned.
        if (System.getenv('ROADHAUL_KEYSTORE_FILE')) {
            release {
                storeFile file(System.getenv('ROADHAUL_KEYSTORE_FILE'))
                storePassword System.getenv('ROADHAUL_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ROADHAUL_KEY_ALIAS')
                keyPassword System.getenv('ROADHAUL_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (System.getenv('ROADHAUL_KEYSTORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
