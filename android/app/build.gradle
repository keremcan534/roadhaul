apply plugin: 'com.android.application'

// The game's version comes from package.json.
def packageJson = new groovy.json.JsonSlurper().parse(file('../../package.json'))

android {
    namespace = "com.keremcan534.roadhaul"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.keremcan534.roadhaul"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI numbers its builds (ROADHAUL_VERSION_CODE), so a newer one installs over an older one.
        versionCode((System.getenv('ROADHAUL_VERSION_CODE') ?: '1') as Integer)
        versionName packageJson.version
        // The ads (docs/RELEASE.md): ROADHAUL_ADS is off, test or live. AdMob's app id goes into the manifest: the
        // game's own (ROADHAUL_ADMOB_APP_ID) for live ads, Google's sample app's for test ads.
        def ads = System.getenv('ROADHAUL_ADS') ?: 'off'
        def admobAppId = System.getenv('ROADHAUL_ADMOB_APP_ID')
        if (ads == 'live' && !admobAppId) {
            throw new GradleException('ROADHAUL_ADS=live needs ROADHAUL_ADMOB_APP_ID, AdMob\'s id for the app (docs/RELEASE.md).')
        }
        manifestPlaceholders += [admobAppId: admobAppId ?: 'ca-app-pub-3940256099942544~3347511713']
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // A debug key kept with the project: every debug build, from CI or any machine, installs over the
        // last one and keeps the saved game. It is public, so it must never sign a release.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // The upload key Google Play knows the game by: secret, never in the repository. CI unpacks it from the
        // repository's secrets (.github/workflows/release.yml); on a desktop it comes from the same variables
        // (docs/RELEASE.md). Without them a release build is left unsigned.
        if (System.getenv('ROADHAUL_KEYSTORE_FILE')) {
            release {
                storeFile file(System.getenv('ROADHAUL_KEYSTORE_FILE'))
                storePassword System.getenv('ROADHAUL_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ROADHAUL_KEY_ALIAS')
                keyPassword System.getenv('ROADHAUL_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // R8 shrinks and optimizes the Java side (Capacitor, its plugins, Play Billing, AdMob) and drops the
            // resources nothing uses; the libraries bring their own keep rules, proguard-rules.pro adds the rest.
            // The bundle carries R8's mapping file, so Google Play shows crashes with their real names.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('ROADHAUL_KEYSTORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }
}

// A bundle for Google Play carries the ads it was meant to (docs/RELEASE.md). ROADHAUL_ADS is said out loud, live or
// off, and the game inside was built the same way: build-info.json, written by the web build (vite.config.ts). Google's
// test ads never pay, so a release refuses them, and a release built in a shell that forgot the ads' variables (the
// web build then has none) is refused too.
gradle.taskGraph.whenReady { graph ->
    if (!graph.allTasks.any { it.project == project && it.name ==~ /(bundle|assemble)Release/ }) {
        return
    }
    def wanted = System.getenv('ROADHAUL_ADS') ?: ''
    if (!(wanted in ['live', 'off'])) {
        throw new GradleException("A release needs ROADHAUL_ADS=live (the game's own ads) or ROADHAUL_ADS=off (none), not \"${wanted}\": Google's test ads never pay (docs/RELEASE.md).")
    }
    def infoFile = file('src/main/assets/public/build-info.json')
    if (!infoFile.exists()) {
        throw new GradleException('The game is not in the Android project yet: run npm run android first (docs/RELEASE.md).')
    }
    def built = new groovy.json.JsonSlurper().parse(infoFile).ads
    if (built != wanted) {
        throw new GradleException("The game inside was built with ROADHAUL_ADS=${built}, not ${wanted}: run npm run android again in this shell (docs/RELEASE.md).")
    }
    if (!System.getenv('ROADHAUL_VERSION_CODE')) {
        throw new GradleException('A release needs ROADHAUL_VERSION_CODE, higher than the last upload\'s (docs/RELEASE.md).')
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
